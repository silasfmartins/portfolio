# Checks the site on every push and pull request. Without Hygraph secrets, it builds with fallback content.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # Pinned: `ubuntu-latest` is moving to Ubuntu 26, where `playwright install --with-deps`
    # failed on November 11, 2026 (commit 302cf69). Check it again before turning e2e back on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No env files in git
        run: "! git ls-files | grep -E '(^|/)\\.env' | grep -v '\\.env\\.example$'"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm i18n:check
      - run: pnpm build
      # Playwright tests (e2e/) are paused since November 12, 2026: they stay in the repo but do
      # not run. To turn them back on, add `EXPOSE_TESTING_API: "1"` to the job env and the steps
      # `pnpm exec playwright install --with-deps chromium` and `pnpm test:e2e`.
